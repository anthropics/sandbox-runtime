          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -subj '/CN=localhost' -keyout server.key -out server.csr 2> /dev/null
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 \
            -extfile <(printf 'subjectAltName=DNS:localhost\n') -out server.crt 2> /dev/null
          rm ca.key server.csr
          mkdir empty
          size() { grep -c 'BEGIN CERTIFICATE' /etc/ssl/certs/ca-certificates.crt; }
          before=$(size)
          sudo cp ca.crt /usr/local/share/ca-certificates/made-here.crt
          sudo update-ca-certificates > /dev/null 2>&1
          [ "$(size)" -eq $((before + 1)) ] || stop "The bundle went from $before certificates to $(size), not to one more."
          openssl s_server -accept 8443 -cert server.crt -key server.key -www > /dev/null 2>&1 < /dev/null &
          server=$!
          curl -fsS -o /dev/null --retry 5 --retry-connrefused --retry-delay 1 https://localhost:8443/ \
            || stop 'curl does not accept the local server.'
          for node in "${nodes[@]}"; do
            version=$("$node" --version)
            "$node" check.cjs get https://localhost:8443/ || stop "Node $version does not read the store."
            if SSL_CERT_FILE="$PWD/ca.crt" SSL_CERT_DIR="$PWD/empty" "$node" check.cjs get "$registry/npm/12.2.0" > refused.log; then
              stop "Node $version reads a list besides the store."
            fi
            grep -q -E 'UNABLE_TO_GET_ISSUER_CERT|UNABLE_TO_VERIFY_LEAF_SIGNATURE|SELF_SIGNED_CERT_IN_CHAIN' refused.log \
              || stop "Node $version failed with one CA, but not at the certificate: $(head -c 60 refused.log)"
            get "$node" check.cjs get "$registry/npm/12.2.0" || stop "Node $version cannot reach the registry."
            echo "Node $version reads the store, and no list of its own."
          done
          kill "$server" 2> /dev/null || true
          sudo rm /usr/local/share/ca-certificates/made-here.crt
          sudo update-ca-certificates --fresh > /dev/null 2>&1
          [ "$(size)" -eq "$before" ] || stop "The bundle went from $before certificates to $(size)."
          node check.cjs store /etc/ssl/certs || stop 'A listed certificate or key is in the store.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run build:java-agent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-proxy-agent
          path: vendor/java-proxy-agent/srt-proxy-agent.jar
          if-no-files-found: error

  build-srt-win:
    name: Build srt-win (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      # Node and git read the CA file that the first step writes.
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: C:/ca-file/certificates.pem
      SSL_CERT_DIR: C:/ca-file/none
      GIT_SSL_CAINFO: C:/ca-file/certificates.pem
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.sslBackend
      GIT_CONFIG_VALUE_0: openssl
    steps:
      - name: Write a CA file without the listed certificates
        timeout-minutes: 5
        shell: pwsh
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          $ErrorActionPreference = 'Stop'
          trap { "::error::No CA file was written ($($_.Exception.GetType().Name), line $($_.InvocationInfo.ScriptLineNumber))."; exit 1 }
          New-Item -ItemType Directory -Force $env:SSL_CERT_DIR | Out-Null
          if (@(Get-ChildItem -Force $env:SSL_CERT_DIR).Count -ne 0) { '::error::The folder that is to hold no certificate holds something.'; exit 1 }
          $script = Join-Path $env:RUNNER_TEMP 'write-ca-file.cjs'
          Set-Content -Path $script -Value @'
          const { createHash, X509Certificate } = require('crypto')
          const fs = require('fs')
          const { rootCertificates } = require('tls')
          try {
            const listed = new Set(process.env.LISTED.split(/\s+/).filter(Boolean))
            if (listed.size !== 10 || [...listed].some(hash => !/^[0-9a-f]{64}$/.test(hash))) {
              throw new Error('The list does not hold 10 SHA-256 hashes.')
            }
            const sha256 = data => createHash('sha256').update(data).digest('hex')
            const isListed = pem => {
              const certificate = new X509Certificate(pem)
              const key = certificate.publicKey.export({ type: 'spki', format: 'der' })
              return listed.has(sha256(certificate.raw)) || listed.has(sha256(key))
            }
            const kept = rootCertificates.filter(pem => !isListed(pem))
            if (kept.length === 0) throw new Error('Nothing would be left.')
            const file = process.env.SSL_CERT_FILE
            fs.writeFileSync(file, kept.map(pem => pem + '\n').join(''))
            const written =
              fs.readFileSync(file, 'utf8').match(/-----BEGIN CERTIFICATE-----[^-]+-----END CERTIFICATE-----/g) ?? []
            if (written.length !== kept.length || written.some(isListed) || !kept.every(pem => written.includes(pem))) {
              throw new Error(`The file holds ${written.length} certificates, expected ${kept.length}.`)
            }
            const all = rootCertificates.length
            console.log(`Left out ${all - kept.length} of ${all} certificates; ${kept.length} are in the file.`)
          } catch (error) {
            console.log(`::error::${error.message}`)
            process.exit(1)
          }
          '@
          node $script
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Drop the listed CA certificates from the Windows stores
        timeout-minutes: 5
        shell: pwsh
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          $ErrorActionPreference = 'Stop'
          trap { "::error::The stores were not cleaned ($($_.Exception.GetType().Name), line $($_.InvocationInfo.ScriptLineNumber))."; exit 1 }
          function Stop-Step($message) { "::error::$message"; exit 1 }
          $listed = @(-split $env:LISTED)
          if ($listed.Count -ne 10 -or @($listed -notmatch '^[0-9a-f]{64}$').Count -ne 0) { Stop-Step 'The list does not hold 10 SHA-256 hashes.' }
          function Get-Hash($bytes) { (Get-FileHash -Algorithm SHA256 -InputStream ([IO.MemoryStream]::new([byte[]]$bytes))).Hash.ToLower() }
          function Find-Listed($store) {
            Get-ChildItem "Cert:\$store" | Where-Object {
              $listed -contains (Get-Hash $_.RawData) -or $listed -contains (Get-Hash $_.PublicKey.ExportSubjectPublicKeyInfo())
            }
          }
          foreach ($store in 'LocalMachine\Root', 'LocalMachine\AuthRoot', 'LocalMachine\CA') {
            $found = @(Find-Listed $store)
            $found | Remove-Item
            "Dropped $($found.Count) certificates from $store."
          }
          $left = @('LocalMachine', 'CurrentUser' | ForEach-Object { Find-Listed "$_\Root"; Find-Listed "$_\AuthRoot"; Find-Listed "$_\CA" })
          if ($left.Count -gt 0) { Stop-Step "$($left.Count) listed certificates are still in the stores." }
          if (@(Get-ChildItem Cert:\LocalMachine\Root).Count -eq 0) { Stop-Step 'The store reads as empty, so it was not checked.' }
          $policy = Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\SystemCertificates\AuthRoot
          if ($policy.DisableRootAutoUpdate -ne 1) { Stop-Step 'DisableRootAutoUpdate is not 1.' }
      - name: Check the CA file and the Windows stores
        timeout-minutes: 15
        shell: pwsh
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          trap { "::error::The check stopped ($($_.Exception.GetType().Name), line $($_.InvocationInfo.ScriptLineNumber))."; exit 1 }
          function Stop-Step($message) { "::error::$message"; exit 1 }
          $registry = 'https://registry.npmjs.org'
          $hosts = -split 'github.com api.github.com release-assets.githubusercontent.com results-receiver.actions.githubusercontent.com nodejs.org registry.npmjs.org static.rust-lang.org crates.io index.crates.io static.crates.io'
          $work = Join-Path $env:RUNNER_TEMP 'ca-check'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work

          $listed = @(-split $env:LISTED)
          function Get-Hash($bytes) { (Get-FileHash -Algorithm SHA256 -InputStream ([IO.MemoryStream]::new([byte[]]$bytes))).Hash.ToLower() }
          if ($listed.Count -ne 10) { Stop-Step 'The list does not hold 10 hashes.' }
          $left = 0
          foreach ($store in 'LocalMachine\Root', 'LocalMachine\AuthRoot', 'LocalMachine\CA', 'CurrentUser\Root', 'CurrentUser\AuthRoot', 'CurrentUser\CA') {
            $held = @(Get-ChildItem "Cert:\$store")
            $found = @($held | Where-Object {
              $listed -contains (Get-Hash $_.RawData) -or $listed -contains (Get-Hash $_.PublicKey.ExportSubjectPublicKeyInfo())
            })
            "$($store) holds $($held.Count) certificates, $($found.Count) of them listed."
            if ($store -eq 'LocalMachine\Root' -and $held.Count -eq 0) { Stop-Step 'The store reads as empty, so it was not checked.' }
            $left += $found.Count
          }
          if ($left -gt 0) { Stop-Step "$left listed certificates are in the Windows stores." }
          $elevated = [bool](whoami /groups | Select-String -SimpleMatch 'S-1-16-12288')
          "Elevated: $elevated."

          Set-Content -Path check.cjs -Value @'
          const { createHash, X509Certificate } = require('crypto')
          const fs = require('fs')
          const [mode, target] = process.argv.slice(2)
          const sha256 = data => createHash('sha256').update(data).digest('hex')
          if (mode === 'get') {
            // No process.exit(): the process ends when the connection has closed.
            fetch(target, { redirect: 'manual' })
              .then(response => response.arrayBuffer())
              .catch(error => {
                console.log(String(error.cause?.code ?? error.name))
                process.exitCode = 1
              })
          } else {
            // The file holds this Node's own certificates but for the listed ones, and no other.
            try {
              const listed = new Set(process.env.LISTED.split(/\s+/).filter(Boolean))
              const isListed = pem => {
                const certificate = new X509Certificate(pem)
                const key = certificate.publicKey.export({ type: 'spki', format: 'der' })
                return listed.has(sha256(certificate.raw)) || listed.has(sha256(key))
              }
              const own = require('tls').rootCertificates
              const wanted = own.filter(pem => !isListed(pem))
              const held =
                fs.readFileSync(target, 'latin1').match(/-----BEGIN CERTIFICATE-----[^-]+-----END CERTIFICATE-----/g) ?? []
              const found = held.filter(isListed).length
              const same = held.length === wanted.length && wanted.every(pem => held.includes(pem))
              console.log(
                `${own.length - wanted.length} of the ${own.length} certificates of Node ${process.version} are listed; ` +
                  `the file holds ${held.length} certificates, ${found} of them listed`,
              )
              process.exitCode = listed.size === 10 && wanted.length > 0 && found === 0 && same ? 0 : 1
            } catch {
              console.log('The file could not be read.')
              process.exitCode = 1
            }
          }
          '@

          # The image's Node, and those the runner starts actions with.
          $nodes = @((Get-Command node).Source)
          $runner = (Get-Process -Id $PID).Parent.Path
          if ($runner) { $nodes += @(Get-Item (Join-Path (Split-Path (Split-Path $runner)) 'externals\node[0-9][0-9]\bin\node.exe') -ErrorAction SilentlyContinue | ForEach-Object FullName) }
          function Test-Get($node, $url) {
            $script:why = & $node check.cjs get $url
            if ($LASTEXITCODE -ne 0) { Start-Sleep 10; $script:why = & $node check.cjs get $url }
            $LASTEXITCODE -eq 0
          }

          node check.cjs file $env:SSL_CERT_FILE
          if ($LASTEXITCODE -ne 0) { Stop-Step 'The CA file is not the list of Node without the listed certificates.' }

          # A certificate made here, as the only one: Node and git refuse.
          $made = New-SelfSignedCertificate -Subject 'CN=made here' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $made = Get-Item "Cert:\CurrentUser\My\$($made.Thumbprint)"
          $other = Join-Path $work 'other.pem'
          Set-Content -Path $other -Value $made.ExportCertificatePem()
          Remove-Item -Path "Cert:\CurrentUser\My\$($made.Thumbprint)" -DeleteKey
          Get-ChildItem Cert:\CurrentUser\CA, Cert:\LocalMachine\CA | Where-Object Thumbprint -eq $made.Thumbprint | Remove-Item
          $file = $env:SSL_CERT_FILE

          foreach ($node in $nodes) {
            $version = & $node --version
            foreach ($name in $hosts) {
              if (-not (Test-Get $node "https://$name/")) { Stop-Step "Node $version cannot reach $name ($why)." }
            }
            if (-not (Test-Get $node "$registry/npm/12.2.0")) { Stop-Step "Node $version cannot reach the registry ($why)." }
            $env:SSL_CERT_FILE = $other
            $refused = & $node check.cjs get "$registry/npm/12.2.0"
            $code = $LASTEXITCODE
            $env:SSL_CERT_FILE = $file
            if ($code -eq 0) { Stop-Step "Node $version reads a list besides the CA file." }
            if ("$refused" -notmatch 'UNABLE_TO_GET_ISSUER_CERT|UNABLE_TO_VERIFY_LEAF_SIGNATURE|SELF_SIGNED_CERT_IN_CHAIN') {
              Stop-Step "Node $version failed with one CA, but not at the certificate: $refused"
            }
            "Node $version reads the CA file, and no list of its own."
          }
          npm view npm version --registry "$registry/" | Out-Null
          if ($LASTEXITCODE -ne 0) { Stop-Step 'npm cannot reach the registry.' }

          $env:GIT_TERMINAL_PROMPT = '0'
          $repository = "https://github.com/$env:GITHUB_REPOSITORY"
          git ls-remote $repository HEAD | Out-Null
          if ($LASTEXITCODE -ne 0) { Stop-Step 'git cannot reach the repository.' }
          $env:GIT_SSL_CAINFO = $other
          git ls-remote $repository HEAD 2> refused.log | Out-Null
          $code = $LASTEXITCODE
          $env:GIT_SSL_CAINFO = $file
          if ($code -eq 0) { Stop-Step 'git reads a list besides the CA file.' }
          if (-not (Select-String -Quiet 'local issuer certificate' refused.log)) { Stop-Step 'git failed with one CA, but not at the certificate.' }
          'git reads the CA file, and no list of its own.'

          # What reads the Windows stores.
          foreach ($name in $hosts) {
            $reached = $false
            foreach ($attempt in 1, 2) {
              try { Invoke-WebRequest "https://$name/" -TimeoutSec 30 -SkipHttpErrorCheck | Out-Null; $reached = $true; break }
              catch { $type = $_.Exception.GetType().Name; Start-Sleep 10 }
            }
            if (-not $reached) { Stop-Step "$name cannot be reached over the Windows stores ($type)." }
          }
          & "$env:SystemRoot\System32\curl.exe" -sS -o NUL --max-time 30 --retry 3 "$registry/"
          if ($LASTEXITCODE -ne 0) { Stop-Step 'curl cannot reach the registry.' }
          "$($hosts.Count) hosts reached over the Windows stores."

          if (Get-Command cargo -ErrorAction SilentlyContinue) {
            $library = if ("$(cargo version --verbose 2> $null)" -match 'ssl:([^)\s]+)') { $Matches[1] } else { 'not reported' }
            "The TLS library of cargo: $library."
            if ($library -notin 'Schannel', 'not reported') { Stop-Step 'cargo does not read the Windows stores.' }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      # Installs the version named in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: npm run build:srt-win
      - name: Verify srt-win.exe runs
        shell: pwsh
        run: |
          $exe = "vendor/srt-win/${{ matrix.arch }}/srt-win.exe"
          if (-not (Test-Path $exe)) { throw "$exe not found" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "srt-win.exe --version exited $LASTEXITCODE" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srt-win-${{ matrix.arch }}
          path: vendor/srt-win/${{ matrix.arch }}
          if-no-files-found: error

  pack:
    name: Pack
    needs: [build-seccomp, build-java-agent, build-srt-win]
    runs-on: ubuntu-24.04
    env:
      # Node reads the trust store of the system.
      NODE_OPTIONS: --use-openssl-ca
    steps:
      - name: Drop the listed CA certificates from the trust store
        timeout-minutes: 5
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          stop() { echo "::error::$1"; exit 1; }
          conf=/etc/ca-certificates.conf
          shipped=/usr/share/ca-certificates
          added=/usr/local/share/ca-certificates
          store=/etc/ssl/certs
          bundle=$store/ca-certificates.crt

          declare -A listed=() cert_of=() key_of=() gone=()
          for hash in $LISTED; do
            [[ $hash =~ ^[0-9a-f]{64}$ ]] || stop 'The list holds an entry that is not a SHA-256 hash.'
            listed[$hash]=1
          done
          [ ${#listed[@]} -eq 10 ] || stop "The list holds ${#listed[@]} hashes, not 10."

          # Reads the PEM file $1. Sets count to the number of its certificates, hits
          # to how many of them are listed, and kept to the hashes of the others.
          read_file() {
            local line block='' cert key
            count=0 hits=0 kept=()
            while IFS= read -r line || [ -n "$line" ]; do
              line=${line%$'\r'}
              case "$line" in
                '-----BEGIN CERTIFICATE-----')
                  [ -z "$block" ] || return 1
                  block=$line$'\n'
                  ;;
                '-----END CERTIFICATE-----')
                  [ -n "$block" ] || return 1
                  block+=$line
                  if [ -z "${cert_of[$block]:-}" ]; then
                    cert=$(openssl x509 -outform DER <<< "$block" 2> /dev/null | sha256sum) || return 1
                    key=$(openssl x509 -noout -pubkey <<< "$block" 2> /dev/null | openssl pkey -pubin -outform DER 2> /dev/null | sha256sum) || return 1
                    cert_of[$block]=${cert%% *}
                    key_of[$block]=${key%% *}
                  fi
                  cert=${cert_of[$block]}
                  key=${key_of[$block]}
                  count=$((count + 1))
                  if [ -n "${listed[$cert]:-}" ] || [ -n "${listed[$key]:-}" ]; then
                    hits=$((hits + 1))
                  else
                    kept+=("$cert")
                  fi
                  block=''
                  ;;
                *-----BEGIN* | *-----END*)
                  return 1
                  ;;
                *)
                  [ -z "$block" ] || block+=$line$'\n'
                  ;;
              esac
            done < "$1" || return 1
            [ -z "$block" ]
          }

          [ -d "$shipped" ] && [ -f "$conf" ] || stop 'The store is not laid out as expected.'
          read_file "$bundle" || stop 'The bundle could not be read.'
          before=$count
          expected=$((count - hits))
          [ "$expected" -gt 0 ] || stop "Nothing would be left of the $before certificates in the bundle."
          want=$(printf '%s\n' "${kept[@]}" | sort)

          # Keystores in other formats, and the hooks that would write them again.
          sudo find "$store" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          sudo rm -rf /etc/ca-certificates/update.d

          sources=("$shipped")
          [ ! -d "$added" ] || sources+=("$added")
          while IFS= read -r -d '' file; do
            read_file "$file" || stop 'A certificate file could not be read.'
            [ "$hits" -gt 0 ] || continue
            [ "$hits" -eq "$count" ] || stop "A file holds $count certificates, of which only $hits are listed."
            sudo rm -f -- "$file" < /dev/null
            gone[$file]=1
          done < <(find -L "${sources[@]}" -type f -print0)

          new=$(mktemp)
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              '' | '#'* | '!'*) ;;
              *) [ -z "${gone[$shipped/$line]:-}" ] || line="!$line" ;;
            esac
            printf '%s\n' "$line"
          done < "$conf" > "$new" || stop 'The selection of certificates could not be read.'
          sudo tee "$conf" < "$new" > /dev/null
          rm -f "$new"

          sudo update-ca-certificates --fresh > /dev/null 2>&1 < /dev/null || stop 'The store could not be rebuilt.'

          after='' got=''
          for entry in "$store"/*; do
            [ -f "$entry" ] || stop 'An entry of the store is not a file, so it was not checked.'
            read_file "$entry" || stop 'An entry of the store could not be read.'
            [ "$count" -gt 0 ] || stop 'An entry of the store holds no certificate.'
            [ "$hits" -eq 0 ] || stop 'A listed certificate or key is still in the store.'
            [ "$entry" != "$bundle" ] || { after=$count; got=$(printf '%s\n' "${kept[@]}" | sort); }
          done
          [ -n "$after" ] && [ "$got" = "$want" ] \
            || stop "The bundle went from $before certificates to ${after:-none}, expected $expected."
          echo "Dropped ${#gone[@]} files and $((before - expected)) of $before certificates; $expected remain."
      - name: Check the trust store
        timeout-minutes: 10
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          set -euo pipefail
          stop() { echo "::error::$1"; exit 1; }
          cd "$(mktemp -d)"
          registry=https://registry.npmjs.org
          hosts='github.com api.github.com release-assets.githubusercontent.com results-receiver.actions.githubusercontent.com token.actions.githubusercontent.com nodejs.org api.adoptium.net registry.npmjs.org fulcio.sigstore.dev rekor.sigstore.dev tuf-repo-cdn.sigstore.dev'

          cat > check.cjs << 'JS'
          const { createHash, X509Certificate } = require('crypto')
          const fs = require('fs')
          const [mode, target] = process.argv.slice(2)
          const sha256 = data => createHash('sha256').update(data).digest('hex')
          if (mode === 'get') {
            fetch(target, { redirect: 'manual' }).then(
              response => response.arrayBuffer().then(() => process.exit(0)),
              error => {
                console.log(String(error.cause?.code ?? error.name))
                process.exit(1)
              },
            )
          } else {
            // Every entry of the folder: no certificate in it is listed, by either hash.
            try {
              const listed = new Set(process.env.LISTED.split(/\s+/).filter(Boolean))
              let certificates = 0
              let found = 0
              const entries = fs.readdirSync(target)
              for (const entry of entries) {
                const blocks = fs
                  .readFileSync(`${target}/${entry}`, 'latin1')
                  .match(/-----BEGIN CERTIFICATE-----[^-]+-----END CERTIFICATE-----/g)
                for (const block of blocks ?? []) {
                  const certificate = new X509Certificate(block)
                  const key = certificate.publicKey.export({ type: 'spki', format: 'der' })
                  certificates++
                  if (listed.has(sha256(certificate.raw)) || listed.has(sha256(key))) found++
                }
              }
              console.log(`${entries.length} entries, ${certificates} certificates, ${found} listed`)
              process.exit(listed.size === 10 && certificates > 0 && found === 0 ? 0 : 1)
            } catch {
              console.log('An entry could not be read.')
              process.exit(1)
            }
          }
          JS

          # The image's Node, and those the runner starts actions with.
          nodes=("$(command -v node)")
          runner=$(readlink -f "/proc/$PPID/exe" 2> /dev/null || true)
          for node in "${runner%/bin/*}"/externals/node[0-9][0-9]/bin/node; do
            [ ! -x "$node" ] || nodes+=("$node")
          done
          get() { "$@" || { sleep 10 && "$@"; }; }

          node check.cjs store /etc/ssl/certs || stop 'A listed certificate or key is in the store.'

          for host in $hosts; do
            curl -sS -o /dev/null --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors "https://$host/" \
              || stop "curl cannot reach $host."
            for node in "${nodes[@]}"; do
              get "$node" check.cjs get "https://$host/" || stop "Node $("$node" --version) cannot reach $host."
            done
          done
          get npm view npm version --registry "$registry/" > /dev/null || stop 'npm cannot reach the registry.'

          # A CA made here, in the store: Node accepts a server under it. The same CA
          # as the only one: Node refuses the registry.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj '/CN=made here' -addext 'keyUsage=critical,keyCertSign' -keyout ca.key -out ca.crt 2> /dev/null
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -subj '/CN=localhost' -keyout server.key -out server.csr 2> /dev/null
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 \
            -extfile <(printf 'subjectAltName=DNS:localhost\n') -out server.crt 2> /dev/null
          rm ca.key server.csr
          mkdir empty
          size() { grep -c 'BEGIN CERTIFICATE' /etc/ssl/certs/ca-certificates.crt; }
          before=$(size)
          sudo cp ca.crt /usr/local/share/ca-certificates/made-here.crt
          sudo update-ca-certificates > /dev/null 2>&1
          [ "$(size)" -eq $((before + 1)) ] || stop "The bundle went from $before certificates to $(size), not to one more."
          openssl s_server -accept 8443 -cert server.crt -key server.key -www > /dev/null 2>&1 < /dev/null &
          server=$!
          curl -fsS -o /dev/null --retry 5 --retry-connrefused --retry-delay 1 https://localhost:8443/ \
            || stop 'curl does not accept the local server.'
          for node in "${nodes[@]}"; do
            version=$("$node" --version)
            "$node" check.cjs get https://localhost:8443/ || stop "Node $version does not read the store."
            if SSL_CERT_FILE="$PWD/ca.crt" SSL_CERT_DIR="$PWD/empty" "$node" check.cjs get "$registry/npm/12.2.0" > refused.log; then
              stop "Node $version reads a list besides the store."
            fi
            grep -q -E 'UNABLE_TO_GET_ISSUER_CERT|UNABLE_TO_VERIFY_LEAF_SIGNATURE|SELF_SIGNED_CERT_IN_CHAIN' refused.log \
              || stop "Node $version failed with one CA, but not at the certificate: $(head -c 60 refused.log)"
            get "$node" check.cjs get "$registry/npm/12.2.0" || stop "Node $version cannot reach the registry."
            echo "Node $version reads the store, and no list of its own."
          done
          kill "$server" 2> /dev/null || true
          sudo rm /usr/local/share/ca-certificates/made-here.crt
          sudo update-ca-certificates --fresh > /dev/null 2>&1
          [ "$(size)" -eq "$before" ] || stop "The bundle went from $before certificates to $(size)."
          node check.cjs store /etc/ssl/certs || stop 'A listed certificate or key is in the store.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'release'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag points to a commit not on main. Refusing to publish unreviewed code."
            exit 1
          fi

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seccomp-x64
          path: vendor/seccomp/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seccomp-arm64
          path: vendor/seccomp/arm64
      - run: chmod +x vendor/seccomp/*/apply-seccomp

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-proxy-agent
          path: vendor/java-proxy-agent

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srt-win-x64
          path: vendor/srt-win/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srt-win-arm64
          path: vendor/srt-win/arm64

      # Only tsc may run from node_modules beside the binaries downloaded
      # above. A git dependency runs its code on install even with
      # --ignore-scripts, and the build's `npm run` puts node_modules/.bin
      # first on PATH, where a dependency could plant its own rm or tsc.
      - name: Install dependencies, link tsc
        run: |
          if [ "$(npm config get allow-git)" = undefined ]; then
            echo "::error::npm older than 11.9 ignores --allow-git"; exit 1
          fi
          npm ci --ignore-scripts --no-bin-links --allow-git=none
          # No -p: fail if npm linked any bin.
          mkdir node_modules/.bin
          ln -s ../typescript/bin/tsc node_modules/.bin/tsc

      - name: Build, pack, verify contents
        # `npm pack` does NOT run prepublishOnly (only directory-mode
        # `npm publish` does), so run it explicitly first.
        run: |
          npm run prepublishOnly
          # --ignore-scripts skips `prepare` (husky).
          npm pack --ignore-scripts
          PKG=$(ls *.tgz)
          LIST=$(tar -tzf "$PKG" | sort)
          echo "::group::tarball contents"
          echo "$LIST"
          echo "::endgroup::"
          for f in vendor/srt-win/x64/srt-win.exe vendor/srt-win/arm64/srt-win.exe vendor/seccomp/x64/apply-seccomp vendor/seccomp/arm64/apply-seccomp vendor/java-proxy-agent/srt-proxy-agent.jar; do
            grep -q "^package/$f$" <<<"$LIST" || { echo "::error::missing $f in tarball"; exit 1; }
          done
          if grep -qE '^package/vendor/(srt-win-src|seccomp-src|java-proxy-agent-src)/' <<<"$LIST"; then
            echo "::error::source dirs leaked into tarball"; exit 1
          fi
          if grep -q '^package/dist/vendor/' <<<"$LIST"; then
            echo "::error::dist/vendor/ duplicated in tarball"; exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  verify-package:
    # Installs the packed tarball and proves getSrtWinPath() resolves and
    # runs the host-arch (x64) prebuilt binary from inside it. The arm64
    # binary and seccomp binaries are not exercised here — the pack
    # job's tarball-contents check covers their presence.
    name: Verify package (Windows)
    needs: pack
    runs-on: windows-latest
    permissions: {}
    env:
      # Node and git read the CA file that the first step writes.
      NODE_OPTIONS: --use-openssl-ca
      SSL_CERT_FILE: C:/ca-file/certificates.pem
      SSL_CERT_DIR: C:/ca-file/none
      GIT_SSL_CAINFO: C:/ca-file/certificates.pem
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: http.sslBackend
      GIT_CONFIG_VALUE_0: openssl
    steps:
      - name: Write a CA file without the listed certificates
        timeout-minutes: 5
        shell: pwsh
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          $ErrorActionPreference = 'Stop'
          trap { "::error::No CA file was written ($($_.Exception.GetType().Name), line $($_.InvocationInfo.ScriptLineNumber))."; exit 1 }
          New-Item -ItemType Directory -Force $env:SSL_CERT_DIR | Out-Null
          if (@(Get-ChildItem -Force $env:SSL_CERT_DIR).Count -ne 0) { '::error::The folder that is to hold no certificate holds something.'; exit 1 }
          $script = Join-Path $env:RUNNER_TEMP 'write-ca-file.cjs'
          Set-Content -Path $script -Value @'
          const { createHash, X509Certificate } = require('crypto')
          const fs = require('fs')
          const { rootCertificates } = require('tls')
          try {
            const listed = new Set(process.env.LISTED.split(/\s+/).filter(Boolean))
            if (listed.size !== 10 || [...listed].some(hash => !/^[0-9a-f]{64}$/.test(hash))) {
              throw new Error('The list does not hold 10 SHA-256 hashes.')
            }
            const sha256 = data => createHash('sha256').update(data).digest('hex')
            const isListed = pem => {
              const certificate = new X509Certificate(pem)
              const key = certificate.publicKey.export({ type: 'spki', format: 'der' })
              return listed.has(sha256(certificate.raw)) || listed.has(sha256(key))
            }
            const kept = rootCertificates.filter(pem => !isListed(pem))
            if (kept.length === 0) throw new Error('Nothing would be left.')
            const file = process.env.SSL_CERT_FILE
            fs.writeFileSync(file, kept.map(pem => pem + '\n').join(''))
            const written =
              fs.readFileSync(file, 'utf8').match(/-----BEGIN CERTIFICATE-----[^-]+-----END CERTIFICATE-----/g) ?? []
            if (written.length !== kept.length || written.some(isListed) || !kept.every(pem => written.includes(pem))) {
              throw new Error(`The file holds ${written.length} certificates, expected ${kept.length}.`)
            }
            const all = rootCertificates.length
            console.log(`Left out ${all - kept.length} of ${all} certificates; ${kept.length} are in the file.`)
          } catch (error) {
            console.log(`::error::${error.message}`)
            process.exit(1)
          }
          '@
          node $script
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Drop the listed CA certificates from the Windows stores
        timeout-minutes: 5
        shell: pwsh
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          $ErrorActionPreference = 'Stop'
          trap { "::error::The stores were not cleaned ($($_.Exception.GetType().Name), line $($_.InvocationInfo.ScriptLineNumber))."; exit 1 }
          function Stop-Step($message) { "::error::$message"; exit 1 }
          $listed = @(-split $env:LISTED)
          if ($listed.Count -ne 10 -or @($listed -notmatch '^[0-9a-f]{64}$').Count -ne 0) { Stop-Step 'The list does not hold 10 SHA-256 hashes.' }
          function Get-Hash($bytes) { (Get-FileHash -Algorithm SHA256 -InputStream ([IO.MemoryStream]::new([byte[]]$bytes))).Hash.ToLower() }
          function Find-Listed($store) {
            Get-ChildItem "Cert:\$store" | Where-Object {
              $listed -contains (Get-Hash $_.RawData) -or $listed -contains (Get-Hash $_.PublicKey.ExportSubjectPublicKeyInfo())
            }
          }
          foreach ($store in 'LocalMachine\Root', 'LocalMachine\AuthRoot', 'LocalMachine\CA') {
            $found = @(Find-Listed $store)
            $found | Remove-Item
            "Dropped $($found.Count) certificates from $store."
          }
          $left = @('LocalMachine', 'CurrentUser' | ForEach-Object { Find-Listed "$_\Root"; Find-Listed "$_\AuthRoot"; Find-Listed "$_\CA" })
          if ($left.Count -gt 0) { Stop-Step "$($left.Count) listed certificates are still in the stores." }
          if (@(Get-ChildItem Cert:\LocalMachine\Root).Count -eq 0) { Stop-Step 'The store reads as empty, so it was not checked.' }
          $policy = Get-ItemProperty HKLM:\SOFTWARE\Policies\Microsoft\SystemCertificates\AuthRoot
          if ($policy.DisableRootAutoUpdate -ne 1) { Stop-Step 'DisableRootAutoUpdate is not 1.' }
      - name: Check the CA file and the Windows stores
        timeout-minutes: 15
        shell: pwsh
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          trap { "::error::The check stopped ($($_.Exception.GetType().Name), line $($_.InvocationInfo.ScriptLineNumber))."; exit 1 }
          function Stop-Step($message) { "::error::$message"; exit 1 }
          $registry = 'https://registry.npmjs.org'
          $hosts = -split 'github.com api.github.com release-assets.githubusercontent.com results-receiver.actions.githubusercontent.com nodejs.org registry.npmjs.org static.rust-lang.org crates.io index.crates.io static.crates.io'
          $work = Join-Path $env:RUNNER_TEMP 'ca-check'
          New-Item -ItemType Directory -Force $work | Out-Null
          Set-Location $work

          $listed = @(-split $env:LISTED)
          function Get-Hash($bytes) { (Get-FileHash -Algorithm SHA256 -InputStream ([IO.MemoryStream]::new([byte[]]$bytes))).Hash.ToLower() }
          if ($listed.Count -ne 10) { Stop-Step 'The list does not hold 10 hashes.' }
          $left = 0
          foreach ($store in 'LocalMachine\Root', 'LocalMachine\AuthRoot', 'LocalMachine\CA', 'CurrentUser\Root', 'CurrentUser\AuthRoot', 'CurrentUser\CA') {
            $held = @(Get-ChildItem "Cert:\$store")
            $found = @($held | Where-Object {
              $listed -contains (Get-Hash $_.RawData) -or $listed -contains (Get-Hash $_.PublicKey.ExportSubjectPublicKeyInfo())
            })
            "$($store) holds $($held.Count) certificates, $($found.Count) of them listed."
            if ($store -eq 'LocalMachine\Root' -and $held.Count -eq 0) { Stop-Step 'The store reads as empty, so it was not checked.' }
            $left += $found.Count
          }
          if ($left -gt 0) { Stop-Step "$left listed certificates are in the Windows stores." }
          $elevated = [bool](whoami /groups | Select-String -SimpleMatch 'S-1-16-12288')
          "Elevated: $elevated."

          Set-Content -Path check.cjs -Value @'
          const { createHash, X509Certificate } = require('crypto')
          const fs = require('fs')
          const [mode, target] = process.argv.slice(2)
          const sha256 = data => createHash('sha256').update(data).digest('hex')
          if (mode === 'get') {
            // No process.exit(): the process ends when the connection has closed.
            fetch(target, { redirect: 'manual' })
              .then(response => response.arrayBuffer())
              .catch(error => {
                console.log(String(error.cause?.code ?? error.name))
                process.exitCode = 1
              })
          } else {
            // The file holds this Node's own certificates but for the listed ones, and no other.
            try {
              const listed = new Set(process.env.LISTED.split(/\s+/).filter(Boolean))
              const isListed = pem => {
                const certificate = new X509Certificate(pem)
                const key = certificate.publicKey.export({ type: 'spki', format: 'der' })
                return listed.has(sha256(certificate.raw)) || listed.has(sha256(key))
              }
              const own = require('tls').rootCertificates
              const wanted = own.filter(pem => !isListed(pem))
              const held =
                fs.readFileSync(target, 'latin1').match(/-----BEGIN CERTIFICATE-----[^-]+-----END CERTIFICATE-----/g) ?? []
              const found = held.filter(isListed).length
              const same = held.length === wanted.length && wanted.every(pem => held.includes(pem))
              console.log(
                `${own.length - wanted.length} of the ${own.length} certificates of Node ${process.version} are listed; ` +
                  `the file holds ${held.length} certificates, ${found} of them listed`,
              )
              process.exitCode = listed.size === 10 && wanted.length > 0 && found === 0 && same ? 0 : 1
            } catch {
              console.log('The file could not be read.')
              process.exitCode = 1
            }
          }
          '@

          # The image's Node, and those the runner starts actions with.
          $nodes = @((Get-Command node).Source)
          $runner = (Get-Process -Id $PID).Parent.Path
          if ($runner) { $nodes += @(Get-Item (Join-Path (Split-Path (Split-Path $runner)) 'externals\node[0-9][0-9]\bin\node.exe') -ErrorAction SilentlyContinue | ForEach-Object FullName) }
          function Test-Get($node, $url) {
            $script:why = & $node check.cjs get $url
            if ($LASTEXITCODE -ne 0) { Start-Sleep 10; $script:why = & $node check.cjs get $url }
            $LASTEXITCODE -eq 0
          }

          node check.cjs file $env:SSL_CERT_FILE
          if ($LASTEXITCODE -ne 0) { Stop-Step 'The CA file is not the list of Node without the listed certificates.' }

          # A certificate made here, as the only one: Node and git refuse.
          $made = New-SelfSignedCertificate -Subject 'CN=made here' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          $made = Get-Item "Cert:\CurrentUser\My\$($made.Thumbprint)"
          $other = Join-Path $work 'other.pem'
          Set-Content -Path $other -Value $made.ExportCertificatePem()
          Remove-Item -Path "Cert:\CurrentUser\My\$($made.Thumbprint)" -DeleteKey
          Get-ChildItem Cert:\CurrentUser\CA, Cert:\LocalMachine\CA | Where-Object Thumbprint -eq $made.Thumbprint | Remove-Item
          $file = $env:SSL_CERT_FILE

          foreach ($node in $nodes) {
            $version = & $node --version
            foreach ($name in $hosts) {
              if (-not (Test-Get $node "https://$name/")) { Stop-Step "Node $version cannot reach $name ($why)." }
            }
            if (-not (Test-Get $node "$registry/npm/12.2.0")) { Stop-Step "Node $version cannot reach the registry ($why)." }
            $env:SSL_CERT_FILE = $other
            $refused = & $node check.cjs get "$registry/npm/12.2.0"
            $code = $LASTEXITCODE
            $env:SSL_CERT_FILE = $file
            if ($code -eq 0) { Stop-Step "Node $version reads a list besides the CA file." }
            if ("$refused" -notmatch 'UNABLE_TO_GET_ISSUER_CERT|UNABLE_TO_VERIFY_LEAF_SIGNATURE|SELF_SIGNED_CERT_IN_CHAIN') {
              Stop-Step "Node $version failed with one CA, but not at the certificate: $refused"
            }
            "Node $version reads the CA file, and no list of its own."
          }
          npm view npm version --registry "$registry/" | Out-Null
          if ($LASTEXITCODE -ne 0) { Stop-Step 'npm cannot reach the registry.' }

          $env:GIT_TERMINAL_PROMPT = '0'
          $repository = "https://github.com/$env:GITHUB_REPOSITORY"
          git ls-remote $repository HEAD | Out-Null
          if ($LASTEXITCODE -ne 0) { Stop-Step 'git cannot reach the repository.' }
          $env:GIT_SSL_CAINFO = $other
          git ls-remote $repository HEAD 2> refused.log | Out-Null
          $code = $LASTEXITCODE
          $env:GIT_SSL_CAINFO = $file
          if ($code -eq 0) { Stop-Step 'git reads a list besides the CA file.' }
          if (-not (Select-String -Quiet 'local issuer certificate' refused.log)) { Stop-Step 'git failed with one CA, but not at the certificate.' }
          'git reads the CA file, and no list of its own.'

          # What reads the Windows stores.
          foreach ($name in $hosts) {
            $reached = $false
            foreach ($attempt in 1, 2) {
              try { Invoke-WebRequest "https://$name/" -TimeoutSec 30 -SkipHttpErrorCheck | Out-Null; $reached = $true; break }
              catch { $type = $_.Exception.GetType().Name; Start-Sleep 10 }
            }
            if (-not $reached) { Stop-Step "$name cannot be reached over the Windows stores ($type)." }
          }
          & "$env:SystemRoot\System32\curl.exe" -sS -o NUL --max-time 30 --retry 3 "$registry/"
          if ($LASTEXITCODE -ne 0) { Stop-Step 'curl cannot reach the registry.' }
          "$($hosts.Count) hosts reached over the Windows stores."

          if (Get-Command cargo -ErrorAction SilentlyContinue) {
            $library = if ("$(cargo version --verbose 2> $null)" -match 'ssl:([^)\s]+)') { $Matches[1] } else { 'not reported' }
            "The TLS library of cargo: $library."
            if ($library -notin 'Schannel', 'not reported') { Stop-Step 'cargo does not read the Windows stores.' }
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The oldest Node that `engines` in package.json allows.
          node-version: '22.12.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Install into clean dir, resolve+run srt-win.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pkg = (Get-ChildItem *.tgz).FullName
          $tmp = Join-Path $env:RUNNER_TEMP "pkg-verify"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Push-Location $tmp
          npm init -y | Out-Null
          npm install $pkg
          # Package is ESM-only ("type":"module"); use dynamic import().
          # End-to-end: getSrtWinPath() from the installed package resolves
          # vendor/srt-win/<arch>/srt-win.exe under node_modules and runs it.
          Set-Content -Path verify.cjs -Value @"
          const { spawnSync } = require('child_process');
          import('@anthropic-ai/sandbox-runtime').then(m => {
            const p = m.getSrtWinPath();
            console.log('resolved:', p);
            const r = spawnSync(p, ['--version'], { encoding: 'utf8' });
            console.log((r.stdout || '') + (r.stderr || ''));
            if (r.status !== 0) throw new Error('exit ' + r.status + ': ' + r.stderr);
          }).catch(e => { console.error(e); process.exit(1); });
          "@
          node verify.cjs
          Pop-Location

  publish:
    # Checks nothing out and builds nothing: publishes the tarball that
    # pack uploaded and verify-package installed.
    name: Publish to npm
    if: github.event_name == 'release'
    needs: [pack, verify-package]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      # npm trusted publishing exchanges this job's OIDC token for a
      # short-lived publish credential.
      id-token: write
    env:
      # Node reads the trust store of the system.
      NODE_OPTIONS: --use-openssl-ca
    steps:
      - name: Drop the listed CA certificates from the trust store
        timeout-minutes: 5
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          stop() { echo "::error::$1"; exit 1; }
          conf=/etc/ca-certificates.conf
          shipped=/usr/share/ca-certificates
          added=/usr/local/share/ca-certificates
          store=/etc/ssl/certs
          bundle=$store/ca-certificates.crt

          declare -A listed=() cert_of=() key_of=() gone=()
          for hash in $LISTED; do
            [[ $hash =~ ^[0-9a-f]{64}$ ]] || stop 'The list holds an entry that is not a SHA-256 hash.'
            listed[$hash]=1
          done
          [ ${#listed[@]} -eq 10 ] || stop "The list holds ${#listed[@]} hashes, not 10."

          # Reads the PEM file $1. Sets count to the number of its certificates, hits
          # to how many of them are listed, and kept to the hashes of the others.
          read_file() {
            local line block='' cert key
            count=0 hits=0 kept=()
            while IFS= read -r line || [ -n "$line" ]; do
              line=${line%$'\r'}
              case "$line" in
                '-----BEGIN CERTIFICATE-----')
                  [ -z "$block" ] || return 1
                  block=$line$'\n'
                  ;;
                '-----END CERTIFICATE-----')
                  [ -n "$block" ] || return 1
                  block+=$line
                  if [ -z "${cert_of[$block]:-}" ]; then
                    cert=$(openssl x509 -outform DER <<< "$block" 2> /dev/null | sha256sum) || return 1
                    key=$(openssl x509 -noout -pubkey <<< "$block" 2> /dev/null | openssl pkey -pubin -outform DER 2> /dev/null | sha256sum) || return 1
                    cert_of[$block]=${cert%% *}
                    key_of[$block]=${key%% *}
                  fi
                  cert=${cert_of[$block]}
                  key=${key_of[$block]}
                  count=$((count + 1))
                  if [ -n "${listed[$cert]:-}" ] || [ -n "${listed[$key]:-}" ]; then
                    hits=$((hits + 1))
                  else
                    kept+=("$cert")
                  fi
                  block=''
                  ;;
                *-----BEGIN* | *-----END*)
                  return 1
                  ;;
                *)
                  [ -z "$block" ] || block+=$line$'\n'
                  ;;
              esac
            done < "$1" || return 1
            [ -z "$block" ]
          }

          [ -d "$shipped" ] && [ -f "$conf" ] || stop 'The store is not laid out as expected.'
          read_file "$bundle" || stop 'The bundle could not be read.'
          before=$count
          expected=$((count - hits))
          [ "$expected" -gt 0 ] || stop "Nothing would be left of the $before certificates in the bundle."
          want=$(printf '%s\n' "${kept[@]}" | sort)

          # Keystores in other formats, and the hooks that would write them again.
          sudo find "$store" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          sudo rm -rf /etc/ca-certificates/update.d

          sources=("$shipped")
          [ ! -d "$added" ] || sources+=("$added")
          while IFS= read -r -d '' file; do
            read_file "$file" || stop 'A certificate file could not be read.'
            [ "$hits" -gt 0 ] || continue
            [ "$hits" -eq "$count" ] || stop "A file holds $count certificates, of which only $hits are listed."
            sudo rm -f -- "$file" < /dev/null
            gone[$file]=1
          done < <(find -L "${sources[@]}" -type f -print0)

          new=$(mktemp)
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              '' | '#'* | '!'*) ;;
              *) [ -z "${gone[$shipped/$line]:-}" ] || line="!$line" ;;
            esac
            printf '%s\n' "$line"
          done < "$conf" > "$new" || stop 'The selection of certificates could not be read.'
          sudo tee "$conf" < "$new" > /dev/null
          rm -f "$new"

          sudo update-ca-certificates --fresh > /dev/null 2>&1 < /dev/null || stop 'The store could not be rebuilt.'

          after='' got=''
          for entry in "$store"/*; do
            [ -f "$entry" ] || stop 'An entry of the store is not a file, so it was not checked.'
            read_file "$entry" || stop 'An entry of the store could not be read.'
            [ "$count" -gt 0 ] || stop 'An entry of the store holds no certificate.'
            [ "$hits" -eq 0 ] || stop 'A listed certificate or key is still in the store.'
            [ "$entry" != "$bundle" ] || { after=$count; got=$(printf '%s\n' "${kept[@]}" | sort); }
          done
          [ -n "$after" ] && [ "$got" = "$want" ] \
            || stop "The bundle went from $before certificates to ${after:-none}, expected $expected."
          echo "Dropped ${#gone[@]} files and $((before - expected)) of $before certificates; $expected remain."
      - name: Check the trust store
        timeout-minutes: 10
        env:
          LISTED: |
            86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b 8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782
            bc4d809b15189d78db3e1d8cf4f9726a795da1643ca5f1358e1ddb0edc0d7eb3 eabc185c4e82d942b1a5978ba3c0181487d6b3b9974e5c49f72f6d0bd9637150
            40f6af0346a99aa1cd1d555a4e9cce62c7f9634603ee406615833dc8c8d00367 376a1a7082a593dccc20d561d119e9ab8d30f11cc321d0a37fa41f0df284e01c
            125609aa301da0a249b97a8239cb6a34216f44dcac9f3954b14292f2e8c8608f b7408b4d2be0238ba37004dd34e276c6019bd2f24c9db7d4980f5f6c359a4bcc
            d7a7a0fb5d7e2731d771e9484ebcdef71d5f0c3e0a2948782bc83ee0ea699ef4 bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3
        run: |
          set -euo pipefail
          stop() { echo "::error::$1"; exit 1; }
          cd "$(mktemp -d)"
          registry=https://registry.npmjs.org
          hosts='github.com api.github.com release-assets.githubusercontent.com results-receiver.actions.githubusercontent.com token.actions.githubusercontent.com nodejs.org api.adoptium.net registry.npmjs.org fulcio.sigstore.dev rekor.sigstore.dev tuf-repo-cdn.sigstore.dev'

          cat > check.cjs << 'JS'
          const { createHash, X509Certificate } = require('crypto')
          const fs = require('fs')
          const [mode, target] = process.argv.slice(2)
          const sha256 = data => createHash('sha256').update(data).digest('hex')
          if (mode === 'get') {
            fetch(target, { redirect: 'manual' }).then(
              response => response.arrayBuffer().then(() => process.exit(0)),
              error => {
                console.log(String(error.cause?.code ?? error.name))
                process.exit(1)
              },
            )
          } else {
            // Every entry of the folder: no certificate in it is listed, by either hash.
            try {
              const listed = new Set(process.env.LISTED.split(/\s+/).filter(Boolean))
              let certificates = 0
              let found = 0
              const entries = fs.readdirSync(target)
              for (const entry of entries) {
                const blocks = fs
                  .readFileSync(`${target}/${entry}`, 'latin1')
                  .match(/-----BEGIN CERTIFICATE-----[^-]+-----END CERTIFICATE-----/g)
                for (const block of blocks ?? []) {
                  const certificate = new X509Certificate(block)
                  const key = certificate.publicKey.export({ type: 'spki', format: 'der' })
                  certificates++
                  if (listed.has(sha256(certificate.raw)) || listed.has(sha256(key))) found++
                }
              }
              console.log(`${entries.length} entries, ${certificates} certificates, ${found} listed`)
              process.exit(listed.size === 10 && certificates > 0 && found === 0 ? 0 : 1)
            } catch {
              console.log('An entry could not be read.')
              process.exit(1)
            }
          }
          JS

          # The image's Node, and those the runner starts actions with.
          nodes=("$(command -v node)")
          runner=$(readlink -f "/proc/$PPID/exe" 2> /dev/null || true)
          for node in "${runner%/bin/*}"/externals/node[0-9][0-9]/bin/node; do
            [ ! -x "$node" ] || nodes+=("$node")
          done
          get() { "$@" || { sleep 10 && "$@"; }; }

          node check.cjs store /etc/ssl/certs || stop 'A listed certificate or key is in the store.'

          for host in $hosts; do
            curl -sS -o /dev/null --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors "https://$host/" \
              || stop "curl cannot reach $host."
            for node in "${nodes[@]}"; do
              get "$node" check.cjs get "https://$host/" || stop "Node $("$node" --version) cannot reach $host."
            done
          done
          get npm view npm version --registry "$registry/" > /dev/null || stop 'npm cannot reach the registry.'

          # A CA made here, in the store: Node accepts a server under it. The same CA
          # as the only one: Node refuses the registry.
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 \
            -subj '/CN=made here' -addext 'keyUsage=critical,keyCertSign' -keyout ca.key -out ca.crt 2> /dev/null
          openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -subj '/CN=localhost' -keyout server.key -out server.csr 2> /dev/null
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 \
            -extfile <(printf 'subjectAltName=DNS:localhost\n') -out server.crt 2> /dev/null
          rm ca.key server.csr
          mkdir empty
          size() { grep -c 'BEGIN CERTIFICATE' /etc/ssl/certs/ca-certificates.crt; }
          before=$(size)
          sudo cp ca.crt /usr/local/share/ca-certificates/made-here.crt
          sudo update-ca-certificates > /dev/null 2>&1
          [ "$(size)" -eq $((before + 1)) ] || stop "The bundle went from $before certificates to $(size), not to one more."
          openssl s_server -accept 8443 -cert server.crt -key server.key -www > /dev/null 2>&1 < /dev/null &
          server=$!
          curl -fsS -o /dev/null --retry 5 --retry-connrefused --retry-delay 1 https://localhost:8443/ \
            || stop 'curl does not accept the local server.'
          for node in "${nodes[@]}"; do
            version=$("$node" --version)
            "$node" check.cjs get https://localhost:8443/ || stop "Node $version does not read the store."
            if SSL_CERT_FILE="$PWD/ca.crt" SSL_CERT_DIR="$PWD/empty" "$node" check.cjs get "$registry/npm/12.2.0" > refused.log; then
              stop "Node $version reads a list besides the store."
            fi
            grep -q -E 'UNABLE_TO_GET_ISSUER_CERT|UNABLE_TO_VERIFY_LEAF_SIGNATURE|SELF_SIGNED_CERT_IN_CHAIN' refused.log \
              || stop "Node $version failed with one CA, but not at the certificate: $(head -c 60 refused.log)"
            get "$node" check.cjs get "$registry/npm/12.2.0" || stop "Node $version cannot reach the registry."
            echo "Node $version reads the store, and no list of its own."
          done
          kill "$server" 2> /dev/null || true
          sudo rm /usr/local/share/ca-certificates/made-here.crt
          sudo update-ca-certificates --fresh > /dev/null 2>&1
          [ "$(size)" -eq "$before" ] || stop "The bundle went from $before certificates to $(size)."
          node check.cjs store /etc/ssl/certs || stop 'A listed certificate or key is in the store.'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm >= 11.5.1. Node 24 is the first
          # release line that ships npm 11.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      # Trusted publishing attaches provenance without --provenance.
      - run: npm publish ./*.tgz --access public
