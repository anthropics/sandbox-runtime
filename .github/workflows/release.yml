name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-seccomp:
    name: Build seccomp (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y gcc libseccomp-dev
      - run: npm run build:seccomp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seccomp-${{ matrix.arch }}
          path: vendor/seccomp/${{ matrix.arch }}
          if-no-files-found: error

  build-java-agent:
    name: Build JVM proxy agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run build:java-agent
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-proxy-agent
          path: vendor/java-proxy-agent/srt-proxy-agent.jar
          if-no-files-found: error

  build-srt-win:
    name: Build srt-win (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # This job builds the helper that runs elevated on a user's machine,
      # so both actions are pinned by commit: `@stable` and `@v2` are a
      # branch and a moving major tag in third-party repositories.
      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      # Swatinem/rust-cache@v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: vendor/srt-win-src
          # Same key as integration-tests.yml so releases (tag refs)
          # restore the cache main pushes have warmed. Without a
          # shared key the release ref never sees a saved cache.
          shared-key: srt-win
      - run: npm run build:srt-win
      - name: Verify srt-win.exe runs
        shell: pwsh
        run: |
          $exe = "vendor/srt-win/${{ matrix.arch }}/srt-win.exe"
          if (-not (Test-Path $exe)) { throw "$exe not found" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "srt-win.exe --version exited $LASTEXITCODE" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srt-win-${{ matrix.arch }}
          path: vendor/srt-win/${{ matrix.arch }}
          if-no-files-found: error

  verify-package:
    # Proves getSrtWinPath() resolves and runs the host-arch (x64)
    # prebuilt binary from inside an installed package. The arm64
    # binary and seccomp binaries are not exercised here — the
    # publish job's tarball-contents check covers their presence.
    #
    # This is the one place the packed tarball is installed and imported,
    # and it does so under Node, so it runs once on each Node release line
    # from the engines floor in package.json (>=22) up. publish waits for
    # both.
    name: Verify package (Windows / Node ${{ matrix.node }})
    needs: build-srt-win
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      # Husky's prepare hook chokes on Windows runners; skip it.
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srt-win-x64
          path: vendor/srt-win/x64
      - run: npm ci
      - run: npm run build
      - name: Pack, install into clean dir, resolve+run srt-win.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm pack
          $pkg = (Get-ChildItem *.tgz).FullName
          $tmp = Join-Path $env:RUNNER_TEMP "pkg-verify"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Push-Location $tmp
          npm init -y | Out-Null
          npm install $pkg
          # Package is ESM-only ("type":"module"); use dynamic import().
          # End-to-end: getSrtWinPath() from the installed package resolves
          # vendor/srt-win/<arch>/srt-win.exe under node_modules and runs it.
          Set-Content -Path verify.cjs -Value @"
          const { spawnSync } = require('child_process');
          import('@anthropic-ai/sandbox-runtime').then(m => {
            const p = m.getSrtWinPath();
            console.log('resolved:', p);
            const r = spawnSync(p, ['--version'], { encoding: 'utf8' });
            console.log((r.stdout || '') + (r.stderr || ''));
            if (r.status !== 0) throw new Error('exit ' + r.status + ': ' + r.stderr);
          }).catch(e => { console.error(e); process.exit(1); });
          "@
          node verify.cjs
          Pop-Location

  publish:
    name: Publish to npm
    needs: [build-seccomp, build-java-agent, build-srt-win, verify-package]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag points to a commit not on main. Refusing to publish unreviewed code."
            exit 1
          fi

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The package is built and packed here, so this stays inside its
          # own engines range (>=22).
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seccomp-x64
          path: vendor/seccomp/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: seccomp-arm64
          path: vendor/seccomp/arm64
      - run: chmod +x vendor/seccomp/*/apply-seccomp

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-proxy-agent
          path: vendor/java-proxy-agent

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srt-win-x64
          path: vendor/srt-win/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srt-win-arm64
          path: vendor/srt-win/arm64

      # `npm ci` installs exactly what package-lock.json records and fails
      # when package.json has moved away from it, so what is built and
      # published here is what CI tested. setup-node wrote an .npmrc that
      # reads the registry token from NODE_AUTH_TOKEN, which only the publish
      # step sets; left unset, npm sends the unexpanded placeholder as the
      # token, and an empty value makes this install anonymous instead.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ''

      - name: Build, pack, verify contents
        # `npm pack` does NOT run prepublishOnly (only directory-mode
        # `npm publish` does), so run it explicitly first — the packed
        # tarball is then byte-identical to what publishes below.
        run: |
          npm run prepublishOnly
          npm pack
          PKG=$(ls *.tgz)
          LIST=$(tar -tzf "$PKG" | sort)
          echo "::group::tarball contents"
          echo "$LIST"
          echo "::endgroup::"
          for f in vendor/srt-win/x64/srt-win.exe vendor/srt-win/arm64/srt-win.exe vendor/seccomp/x64/apply-seccomp vendor/seccomp/arm64/apply-seccomp vendor/java-proxy-agent/srt-proxy-agent.jar; do
            grep -q "^package/$f$" <<<"$LIST" || { echo "::error::missing $f in tarball"; exit 1; }
          done
          if grep -qE '^package/vendor/(srt-win-src|seccomp-src|java-proxy-agent-src)/' <<<"$LIST"; then
            echo "::error::source dirs leaked into tarball"; exit 1
          fi
          if grep -q '^package/dist/vendor/' <<<"$LIST"; then
            echo "::error::dist/vendor/ duplicated in tarball"; exit 1
          fi
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Publish to npm
        # Publish the exact tarball verified above. Publishing a
        # tarball (vs the directory) skips prepublishOnly, so no
        # rebuild happens between verify and publish.
        run: npm publish "$PKG" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
