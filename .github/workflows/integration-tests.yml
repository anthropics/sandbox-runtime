name: Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']

jobs:
  integration-tests:
    name: Tests (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
            os: linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            os: linux
          - arch: x86-64
            runner: macos-15-large
            os: macos
          - arch: arm64
            runner: macos-14
            os: macos
          # The newest macOS as well: the sandbox profile's own regex engine
          # and what Seatbelt refuses have both moved between releases, and
          # the two legs above stay on the images they name.
          - arch: arm64-macos26
            runner: macos-26
            os: macos
          # Windows legs build srt-win, run the Rust smoke scripts,
          # then the TS integration suite (test/sandbox/winsrt.test.ts).
          - arch: x86-64
            runner: windows-latest
            os: windows
          - arch: arm64
            runner: windows-11-arm
            os: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The release line the legs build and test on, and the engines
          # floor in package.json (>=22). The steps at the end of the job
          # that run the built package under Node repeat on 24, the line
          # above it.
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # The JVM proxy agent (vendor/java-proxy-agent) is built from source
      # here, like the seccomp helper; test/sandbox/java-proxy-agent.test.ts
      # then drives it in a real JVM and self-skips when jar or JDK is absent.
      - name: Setup Java (macOS/Linux)
        if: matrix.os != 'windows'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # ─── Windows: srt-win helper binary ─────────────────────────────
      # GitHub-hosted Windows runners run as a member of Administrators
      # with UAC disabled, so NetLocalGroup* and Fwpm* calls succeed
      # without an explicit elevation step.
      - name: Setup Rust (Windows)
        if: matrix.os == 'windows'
        # dtolnay/rust-toolchain@stable, pinned by commit: the ref is a
        # branch, so a tag-shaped `@stable` still runs whatever that
        # branch points at today. The cache below is shared with
        # release.yml, so this job's supply chain is the release's too.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy

      - name: Rust build cache (Windows)
        if: matrix.os == 'windows'
        # Swatinem/rust-cache@v2.9.2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: vendor/srt-win-src
          # Shared with release.yml so tag-ref release builds restore
          # the cache main pushes warm here.
          shared-key: srt-win

      - name: Build srt-win (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # pwsh does NOT fail the step on a native command's non-zero
          # exit by default — without this, `cargo test` failing would
          # be masked by `cargo clippy` exiting 0 on the next line.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build  --release --manifest-path vendor/srt-win-src/Cargo.toml
          cargo test   --release --manifest-path vendor/srt-win-src/Cargo.toml
          cargo clippy --release --manifest-path vendor/srt-win-src/Cargo.toml --all-targets -- -D warnings

      - name: Smoke-test srt-win install lifecycle (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Smoke-test srt-win exec (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-exec.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Smoke-test srt-win additive-ACE lifecycle (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-aces.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Smoke-test srt-win kill-chain invariant (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-kill.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Smoke-test srt-win ambient write-deny lifecycle (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-ambient.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: srt-win machine-store smoke (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/smoke-machine-store.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: TS integration tests (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          # Husky's prepare hook chokes on Windows runners; skip it.
          HUSKY: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run build
          # These are listed explicitly because the non-Windows legs run the
          # whole tree: winsrt-paths.property is the only property suite over
          # the Windows path pipeline, glob-expand holds the UNC pass-raw
          # block that runs on no other leg, and config-validation covers the
          # schema on a real Windows host rather than under a platform spy.
          bun test test/sandbox/winsrt.test.ts test/sandbox/mux-proxy.test.ts test/sandbox/winsrt-paths.property.test.ts test/sandbox/glob-expand.test.ts test/config-validation.test.ts

      - name: Cleanup srt-win state (Windows)
        if: always() && matrix.os == 'windows'
        shell: pwsh
        run: pwsh vendor/srt-win-src/ci/cleanup.ps1 vendor\srt-win-src\target\release\srt-win.exe

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp-dev gcc socat apparmor-profiles zsh

      # The library reads both the output and the exit status of ripgrep, and
      # those differ between ripgrep releases: for an unreadable directory
      # that sits exactly at --max-depth, 14.1.1 prints "Permission denied"
      # and exits 2, where 15.2.0 passes over it and exits 0. 14.1.1 is the
      # release most installations have, so it is the one the main run uses,
      # taken from the upstream release instead of whichever version the
      # package archive serves that day. Each checksum is the one upstream
      # publishes beside the archive, and a mismatch fails the step.
      - name: Install ripgrep 14.1.1 (Linux)
        if: matrix.os == 'linux'
        run: |
          case "${{ matrix.arch }}" in
            x86-64)
              asset=ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
              sha256=4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e
              ;;
            arm64)
              asset=ripgrep-14.1.1-aarch64-unknown-linux-gnu.tar.gz
              sha256=c827481c4ff4ea10c9dc7a4022c8de5db34a5737cb74484d62eb94a95841ab2f
              ;;
            *)
              echo "::error::no ripgrep archive is pinned for ${{ matrix.arch }}"
              exit 1
              ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/$asset"
          echo "$sha256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ripgrep-14.1.1"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/ripgrep-14.1.1" --strip-components=1
          # Ahead of everything already on PATH, for every later step.
          echo "$RUNNER_TEMP/ripgrep-14.1.1" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ripgrep-14.1.1/rg" --version

      - name: Enable unprivileged user namespaces (Linux)
        if: matrix.os == 'linux'
        run: |
          # Ubuntu 24.04+ sets kernel.apparmor_restrict_unprivileged_userns=1 which
          # allows unshare(CLONE_NEWUSER) but grants the new namespace zero
          # capabilities. Disable it so bwrap and apply-seccomp can nest
          # namespaces without needing setuid.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

          # Same argv as bwrapCanNamespace() in test/helpers/bwrap-namespace.ts,
          # which whole suites use as `it.skipIf(!BWRAP_CAN_NAMESPACE)`. A host
          # that cannot nest namespaces must red the leg here rather than skip
          # those arms silently, so this runs unguarded.
          echo "Testing bwrap namespace creation..."
          bwrap --unshare-pid --unshare-user --cap-drop ALL --ro-bind / / --proc /proc true

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install ripgrep zsh

      # `npm ci`, like the Windows legs above: it installs exactly what
      # package-lock.json records and fails when package.json has moved away
      # from it, where `npm install` would resolve again and carry on.
      - name: Install Node dependencies
        if: matrix.os != 'windows'
        run: npm ci

      - name: Lint (ESLint)
        if: matrix.os == 'linux' && matrix.arch == 'x86-64'
        run: npx eslint .

      # `npm run build` compiles src only. This is the one step that checks
      # the types of test/, which bun strips at runtime.
      - name: Typecheck
        if: matrix.os != 'windows'
        run: npm run typecheck

      - name: Build seccomp binaries (Linux)
        if: matrix.os == 'linux'
        run: npm run build:seccomp

      - name: Build JVM proxy agent (macOS/Linux)
        if: matrix.os != 'windows'
        run: npm run build:java-agent

      - name: Build project
        if: matrix.os != 'windows'
        run: npm run build

      - name: Run tests
        if: matrix.os != 'windows'
        run: npm test

      # The suites run the sources unbundled. An application that embeds the
      # library ships it minified and compiled to bytecode in one file, where
      # a function's name, its source text and the files beside it are all
      # gone. This compiles a small program that imports the built package
      # that way and has it wrap real commands.
      - name: Run the package bundled, minified and as bytecode
        if: matrix.os != 'windows'
        run: npm run test:bundled

      # bubblewrap 0.12 refuses a mount on a symlink destination, which the
      # distribution's packaged bubblewrap accepts; run the suite against it
      # as well so a profile that mounts on a link is caught here, not on a
      # user's machine. Pinned by commit, not by the v0.12.0 tag, which the
      # upstream repository can move.
      - name: Build bubblewrap 0.12.0 (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq meson ninja-build libcap-dev pkg-config
          git clone --filter=blob:none https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          cd "$RUNNER_TEMP/bubblewrap"
          git checkout 2a76602a8c71f36c1527cf9fc3417d9149822e0c
          meson setup _build --prefix="$RUNNER_TEMP/bwrap-0.12" -Dselinux=disabled -Dman=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          ninja -C _build
          ninja -C _build install
          "$RUNNER_TEMP/bwrap-0.12/bin/bwrap" --version

      - name: Run tests against bubblewrap 0.12.0 (Linux)
        if: matrix.os == 'linux'
        run: PATH="$RUNNER_TEMP/bwrap-0.12/bin:$PATH" npm test

      # A release from the 15.x line, pinned like the one above. Over the same
      # tree its scan can exit with a different status from 14.1.1 (see the
      # install step above), so the suites that depend on the scan run against
      # it as well. The macOS legs are not pinned to either: they run on
      # whichever release Homebrew serves.
      - name: Install ripgrep 15.2.0 (Linux)
        if: matrix.os == 'linux'
        run: |
          case "${{ matrix.arch }}" in
            x86-64)
              asset=ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
              sha256=33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
              ;;
            arm64)
              asset=ripgrep-15.2.0-aarch64-unknown-linux-gnu.tar.gz
              sha256=a740b91c82eaf9914cfedd353572f2791cbe0162c84101ee0951058f4dcbc90d
              ;;
            *)
              echo "::error::no ripgrep archive is pinned for ${{ matrix.arch }}"
              exit 1
              ;;
          esac
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/$asset"
          echo "$sha256  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ripgrep-15.2.0"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/ripgrep-15.2.0" --strip-components=1
          "$RUNNER_TEMP/ripgrep-15.2.0/rg" --version

      # Every suite under test/ that names ripgrep or the mandatory-deny scan
      # it implements, less the four that never start rg: config-validation
      # (schema only), public-exports (the export list), check-dependencies
      # (replaces the lookup with a spy) and macos-literal-deny-brackets
      # (macOS only).
      - name: Run the ripgrep-dependent tests against ripgrep 15.2.0 (Linux)
        if: matrix.os == 'linux'
        run: |
          export PATH="$RUNNER_TEMP/ripgrep-15.2.0:$PATH"
          rg --version
          bun test \
            test/utils/ripgrep.test.ts \
            test/sandbox/mandatory-deny-paths.test.ts \
            test/sandbox/filesystem-disabled.test.ts \
            test/sandbox/linux-ancestor-pin.test.ts \
            test/sandbox/linux-bwrap-args-file.test.ts \
            test/sandbox/linux-mount-plan-record.test.ts \
            test/sandbox/read-deny-glob.test.ts \
            test/sandbox/readonly-deny-dir-binds.test.ts \
            test/sandbox/readonly-deny-dir-stubs.test.ts \
            test/sandbox/stale-mount-point.test.ts \
            test/sandbox/symlinked-deny-paths.test.ts

      # Everything above runs the library under Bun. `npm run test:node` is
      # the part of the tree that runs the built package under Node: the
      # whichSync fallback, and the control-fd suite, which starts dist/cli.js
      # with the node on PATH. It runs on each release line from the engines
      # floor up. Only these steps repeat, so the job matrix stays as it is.
      - name: Run the tests that use Node (Node 22)
        if: matrix.os != 'windows'
        run: |
          node --version
          npm run test:node

      - name: Setup Node.js 24
        if: matrix.os != 'windows'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run the tests that use Node (Node 24)
        if: matrix.os != 'windows'
        run: |
          node --version
          npm run test:node

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            test-results/
            *.log
          if-no-files-found: ignore

  docker-tests:
    name: Tests (docker / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable unprivileged user namespaces on host
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      # The suite runs twice in one container: first as uid 0 holding
      # CAP_SYS_ADMIN (a root parent on a VM; the sandbox must drop it, or a
      # sandboxed umount lifts any deny), then with it dropped (Docker's
      # default set: the unprivileged container enableWeakerNestedSandbox
      # exists for).
      - name: Run srt end-to-end as uid 0 in a container
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e SRT_E2E_DOCKER=1 \
            ubuntu:24.04 \
            bash -euo pipefail -c '
              apt-get update -qq
              # node and npm come from the image, and bun is pinned to the
              # version the rest of the matrix runs (oven-sh/setup-bun above).
              # The tree carries a dozen bun-version-specific workarounds, so
              # "whatever bun shipped this morning" is not the runtime under
              # test.
              apt-get install -y -qq bubblewrap socat ripgrep python3 curl ca-certificates unzip gcc libseccomp-dev libcap2-bin nodejs npm
              # The release archive, by checksum, rather than an installer
              # piped into a shell.
              case "$(uname -m)" in
                x86_64) bun_zip=bun-linux-x64; bun_sha=36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913 ;;
                aarch64) bun_zip=bun-linux-aarch64; bun_sha=54328bbc2d9c8e0c9f892c544d66c57a83b84139e34909e5ee81758f1ac8fda7 ;;
                *) echo "no bun archive is pinned for $(uname -m)"; exit 1 ;;
              esac
              curl -fsSL -o /tmp/bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/${bun_zip}.zip"
              echo "${bun_sha}  /tmp/bun.zip" | sha256sum -c -
              unzip -q /tmp/bun.zip -d /tmp
              install -m 0755 "/tmp/${bun_zip}/bun" /usr/local/bin/bun
              bun --version
              npm ci
              npm run build:seccomp
              npm run build
              echo "== as uid 0 with CAP_SYS_ADMIN"
              bun test test/docker-weak-sandbox.test.ts
              echo "== as uid 0 without CAP_SYS_ADMIN"
              capsh --drop=cap_sys_admin -- -c "bun test test/docker-weak-sandbox.test.ts"
            '

      # The same two runs on musl. The seccomp helper is static and built
      # here against musl's libseccomp, and bubblewrap, socat and ripgrep are
      # Alpine's own builds, and bun is its musl build. The checkout
      # is copied first: node_modules and the helper the step above left in
      # the workspace were built for glibc.
      - name: Run srt end-to-end as uid 0 in an Alpine container
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            -v "${{ github.workspace }}:/src:ro" \
            -e SRT_E2E_DOCKER=1 \
            alpine:3.22 \
            sh -euc '
              apk add --no-cache bash bubblewrap socat ripgrep python3 curl ca-certificates unzip gcc musl-dev linux-headers libseccomp-dev libseccomp-static libcap-utils libstdc++ libgcc nodejs npm tar
              mkdir /work
              tar -C /src --exclude=./node_modules --exclude=./dist --exclude=./vendor/seccomp/x64 --exclude=./vendor/seccomp/arm64 --exclude=./.git -cf - . | tar -C /work -xf -
              cd /work
              case "$(uname -m)" in
                x86_64) bun_zip=bun-linux-x64-musl; bun_sha=4835eca59d6da70f4674f5642f6e459dcadab773695b2ed9922d131057989742 ;;
                aarch64) bun_zip=bun-linux-aarch64-musl; bun_sha=71760b6c8ea30623b81a4907cb815d48e2ea266f2e73e751534a44a0607950df ;;
                *) echo "no bun archive is pinned for $(uname -m)"; exit 1 ;;
              esac
              curl -fsSL -o /tmp/bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/${bun_zip}.zip"
              echo "${bun_sha}  /tmp/bun.zip" | sha256sum -c -
              unzip -q /tmp/bun.zip -d /tmp
              install -m 0755 "/tmp/${bun_zip}/bun" /usr/local/bin/bun
              bun --version
              npm ci
              npm run build:seccomp
              npm run build
              echo "== as uid 0 with CAP_SYS_ADMIN"
              bun test test/docker-weak-sandbox.test.ts
              echo "== as uid 0 without CAP_SYS_ADMIN"
              capsh --drop=cap_sys_admin -- -c "bun test test/docker-weak-sandbox.test.ts"
              echo "== bundled, minified and as bytecode"
              npm run test:bundled
            '
